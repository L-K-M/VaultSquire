name: GLM 5.2 PR Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - labeled
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: zai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR with GLM 5.2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This password-manager repository uses explicit opt-in: add the
    # `glm-review` label only when the diff may be sent to an external model.
    # pull_request_target has secrets and a write-capable token, so fork PRs are
    # never eligible and the workflow never checks out or executes PR code.
    if: >-
      ${{ github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'glm-review') }}
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - name: Z.ai Code Review
        if: ${{ env.ZAI_API_KEY != '' }}
        uses: L-K-M/zai-code-review@7d0ce7b0c226c70eed194615130fa5b632ba4798
        with:
          ZAI_API_KEY: ${{ env.ZAI_API_KEY }}
          ZAI_MODEL: glm-5.2
          ZAI_REVIEWER_NAME: GLM 5.2 Code Review
          GITHUB_TOKEN: ${{ github.token }}

      - name: Skip when Z.ai API key is unavailable
        if: ${{ env.ZAI_API_KEY == '' }}
        run: echo "Skipping Z.ai review because ZAI_API_KEY is not configured."
