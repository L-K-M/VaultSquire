name: macOS Product

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-product-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Swift 6 build and test
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Hosted runners sometimes float a UserNotificationCenter dialog over
      # the app under UI test; a synthesized click then lands on the dialog
      # instead of the control (observed in run 31336737076). Clearing the
      # agent before the suite removes the stray dialogs; it respawns on
      # demand.
      - name: Dismiss stray notification dialogs
        run: killall UserNotificationCenter || true

      - name: Build, test, sign, and inspect
        run: ./scripts/ci.sh

      - name: Record Workstream 1 performance metrics
        run: ./scripts/measure-workstream-1.sh
