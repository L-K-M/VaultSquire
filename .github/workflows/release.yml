# Signed-only draft release automation. The eligibility job fails before the
# credentialed jobs while the tracked release gate remains closed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eligibility:
    name: Enforce release gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag-object: ${{ steps.validate.outputs.tag-object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an eligible strict version tag on main
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SEMVER_RE='^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$'
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || { echo "::error::Release publication requires a tag."; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ $SEMVER_RE ]] || { echo "::error::Release tag must use vX.Y.Z form without leading zeroes."; exit 1; }
          BUILD="$(./scripts/version.sh --build)"
          ./scripts/check-release-eligibility.sh --version "$VERSION" --build "$BUILD"
          git fetch --force origin main 'refs/tags/v*:refs/tags/v*'
          [[ "$GITHUB_SHA" == "$(git rev-parse origin/main)" ]] \
            || { echo "::error::Tagged commit is not current origin/main."; exit 1; }
          remote_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')"
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$remote_tag" --jq '.verification.verified')" != "true" ]]; then
            echo "::error::Release tag must have a verified cryptographic signature."
            exit 1
          fi
          tagged_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$remote_tag" --jq '.object.sha')"
          [[ "$tagged_commit" == "$GITHUB_SHA" ]] || { echo "::error::Annotated tag does not target GITHUB_SHA."; exit 1; }
          echo "tag-object=$remote_tag" >> "$GITHUB_OUTPUT"
          ./scripts/version.sh --check-history

  ci:
    name: Re-prove the tagged commit
    needs: eligibility
    uses: ./.github/workflows/macos-product.yml

  release:
    name: Sign, notarize, attest, and draft
    needs: [ci, eligibility]
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      APP_NAME: VaultSquire
      BUNDLE_ID: ch.lkmc.VaultSquire
      APP_GROUP: group.ch.lkmc.VaultSquire
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      KEYCHAIN_PROFILE: vaultsquire-notary
      ORIGINAL_TAG_OBJECT: ${{ needs.eligibility.outputs.tag-object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require protected hosting controls and scoped secrets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
        run: |
          [[ -n "$GH_TOKEN" ]] || { echo "::error::RELEASE_ADMIN_TOKEN is unavailable."; exit 1; }
          ./scripts/check-release-hosting.sh

      - name: Require complete signing configuration
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_APP_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROFILE_BASE64 }}
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_TEAM_ID \
            MACOS_APP_PROFILE_BASE64 \
            AC_API_KEY_BASE64 \
            AC_API_KEY_ID \
            AC_API_ISSUER_ID \
            RELEASE_ADMIN_TOKEN; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          [[ ${#missing[@]} -eq 0 ]] || { echo "::error::VaultSquire has no unsigned release fallback; missing secrets: ${missing[*]}"; exit 1; }
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPLE_TEAM_ID must contain ten uppercase letters or digits."; exit 1; }

      - name: Match tag to committed versions
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" == "$(./scripts/version.sh --marketing)" ]] || { echo "::error::Tag does not match MARKETING_VERSION."; exit 1; }
          ./scripts/version.sh --check
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$(./scripts/version.sh --build)" >> "$GITHUB_ENV"

      - name: Verify the pinned toolchain
        run: ./scripts/verify-toolchain.sh

      - name: Import Developer ID identity
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/vaultsquire-signing.keychain-db"
          P12="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$P12"' EXIT
          if ! printf '%s' "$DEVELOPER_ID_P12_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$P12" 2>/dev/null \
             || [[ ! -s "$P12" ]]; then
            echo "::error::DEVELOPER_ID_P12_BASE64 is invalid."
            exit 1
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$DEVELOPER_ID_P12_PASSWORD" -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          identity_line="$(security find-identity -v -p codesigning "$KEYCHAIN" | /usr/bin/grep 'Developer ID Application' | /usr/bin/head -n 1)"
          [[ "$identity_line" == *"($APPLE_TEAM_ID)"* ]] || { echo "::error::Developer ID identity does not belong to APPLE_TEAM_ID."; exit 1; }
          identity="$(printf '%s\n' "$identity_line" | /usr/bin/awk '{ print $2 }')"
          echo "::add-mask::$identity"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Validate and install Developer ID provisioning profile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_APP_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/VaultSquire.provisionprofile"
          profile_plist="$RUNNER_TEMP/VaultSquire-profile.plist"
          if ! printf '%s' "$MACOS_APP_PROFILE_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$profile" 2>/dev/null \
             || [[ ! -s "$profile" ]]; then
            echo "::error::MACOS_APP_PROFILE_BASE64 is invalid."
            exit 1
          fi
          security cms -D -i "$profile" > "$profile_plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")" == "$APPLE_TEAM_ID" ]] || { echo "::error::Provisioning profile Team ID mismatch."; exit 1; }
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :Platform:0' "$profile_plist")" == "OSX" ]] || { echo "::error::Provisioning profile is not for macOS."; exit 1; }
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$profile_plist")" == "$APPLE_TEAM_ID.$BUNDLE_ID" ]] || { echo "::error::Provisioning profile application identifier mismatch."; exit 1; }
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$profile_plist")" == "$APP_GROUP" ]] || { echo "::error::Provisioning profile App Group mismatch."; exit 1; }
          ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:1' "$profile_plist" >/dev/null 2>&1 || { echo "::error::Provisioning profile contains an additional App Group."; exit 1; }
          expiration="$(plutil -extract ExpirationDate raw -o - "$profile_plist")"
          [[ "$expiration" > "$(date -u +%Y-%m-%dT%H:%M:%SZ)" ]] || { echo "::error::Provisioning profile is expired."; exit 1; }
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$profile_plist")" == "true" ]] || { echo "::error::Provisioning profile is not a Developer ID profile."; exit 1; }
          ! /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist" >/dev/null 2>&1 || { echo "::error::Device-limited provisioning profiles cannot be released."; exit 1; }
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.get-task-allow' "$profile_plist" 2>/dev/null | /usr/bin/grep -q '^true$'; then
            echo "::error::Provisioning profile permits debugger attachment."
            exit 1
          fi
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          newdir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          olddir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$newdir" "$olddir"
          cp "$profile" "$newdir/$uuid.provisionprofile"
          cp "$profile" "$olddir/$uuid.provisionprofile"
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"
          echo "PROFILE_PATH_NEW=$newdir/$uuid.provisionprofile" >> "$GITHUB_ENV"
          echo "PROFILE_PATH_OLD=$olddir/$uuid.provisionprofile" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$key"' EXIT
          if ! printf '%s' "$AC_API_KEY_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$key" 2>/dev/null \
             || [[ ! -s "$key" ]]; then
            echo "::error::AC_API_KEY_BASE64 is invalid."
            exit 1
          fi
          xcrun notarytool store-credentials "$KEYCHAIN_PROFILE" \
            --key "$key" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID"

      - name: Archive and export the Developer ID app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/VaultSquire.xcarchive"
          xcodebuild archive \
            -project VaultSquire.xcodeproj \
            -scheme VaultSquire \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$archive" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp"
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :method string developer-id' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string $SIGN_IDENTITY" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" "$export_options"
          xcodebuild -exportArchive \
            -archivePath "$archive" \
            -exportOptionsPlist "$export_options" \
            -exportPath "$RUNNER_TEMP/export"
          echo "APP_PATH=$RUNNER_TEMP/export/$APP_NAME.app" >> "$GITHUB_ENV"

      - name: Verify and launch the exported app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ./scripts/verify-signed-product.sh "$APP_PATH" "$APPLE_TEAM_ID" developer-id "$VERSION" "$BUILD"
          pkill -x VaultSquire >/dev/null 2>&1 || true
          "$APP_PATH/Contents/MacOS/VaultSquire" >/dev/null 2>&1 &
          app_pid=$!
          sleep 2
          kill -0 "$app_pid" 2>/dev/null || { echo "::error::Exported app did not remain running."; wait "$app_pid" || true; exit 1; }
          executable="$(lsof -a -p "$app_pid" -d txt -Fn | /usr/bin/sed -n 's/^n//p' | /usr/bin/head -n 1)"
          [[ "$executable" == "$APP_PATH/Contents/MacOS/VaultSquire" ]] || { echo "::error::Unexpected launch-smoke executable: $executable"; exit 1; }
          osascript -e 'tell application id "ch.lkmc.VaultSquire" to quit'

      - name: Notarize and staple the app
        run: |
          set -euo pipefail
          notary_zip="$RUNNER_TEMP/VaultSquire-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$notary_zip"
          xcrun notarytool submit "$notary_zip" \
            --keychain-profile "$KEYCHAIN_PROFILE" --wait --output-format json \
            > "$RUNNER_TEMP/app-notarization.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/app-notarization.json" >/dev/null
          app_submission="$(jq -r '.id' "$RUNNER_TEMP/app-notarization.json")"
          xcrun notarytool log "$app_submission" --keychain-profile "$KEYCHAIN_PROFILE" \
            "$RUNNER_TEMP/app-notarization-log.json"
          jq -e '.status == "Accepted" and ((.issues // []) | length == 0)' \
            "$RUNNER_TEMP/app-notarization-log.json" >/dev/null
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type exec --verbose=4 "$APP_PATH"

      - name: Package and verify final artifacts
        id: package
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          stage="$RUNNER_TEMP/dmg-stage"
          mount="$RUNNER_TEMP/dmg-mount"
          extract="$RUNNER_TEMP/zip-extract"
          mkdir -p "$dist" "$stage" "$mount" "$extract"
          ditto "$APP_PATH" "$stage/$APP_NAME.app"
          ln -s /Applications "$stage/Applications"
          dmg="$dist/$APP_NAME-$VERSION-arm64.dmg"
          hdiutil create -volname "$APP_NAME $VERSION" -srcfolder "$stage" -ov -format UDZO "$dmg"
          hdiutil verify "$dmg"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun notarytool submit "$dmg" \
            --keychain-profile "$KEYCHAIN_PROFILE" --wait --output-format json \
            > "$RUNNER_TEMP/dmg-notarization.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/dmg-notarization.json" >/dev/null
          dmg_submission="$(jq -r '.id' "$RUNNER_TEMP/dmg-notarization.json")"
          xcrun notarytool log "$dmg_submission" --keychain-profile "$KEYCHAIN_PROFILE" \
            "$RUNNER_TEMP/dmg-notarization-log.json"
          jq -e '.status == "Accepted" and ((.issues // []) | length == 0)' \
            "$RUNNER_TEMP/dmg-notarization-log.json" >/dev/null
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          hdiutil verify "$dmg"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount" "$dmg"
          cleanup_mount() { hdiutil detach -force "$mount" >/dev/null 2>&1 || true; }
          trap cleanup_mount EXIT
          [[ -L "$mount/Applications" && "$(readlink "$mount/Applications")" == "/Applications" ]] || { echo "::error::DMG is missing the /Applications link."; exit 1; }
          ./scripts/verify-signed-product.sh "$mount/$APP_NAME.app" "$APPLE_TEAM_ID" developer-id "$VERSION" "$BUILD"
          xcrun stapler validate "$mount/$APP_NAME.app"
          hdiutil detach "$mount"
          trap - EXIT
          zip="$dist/$APP_NAME-$VERSION-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$zip"
          ditto -x -k "$zip" "$extract"
          ./scripts/verify-signed-product.sh "$extract/$APP_NAME.app" "$APPLE_TEAM_ID" developer-id "$VERSION" "$BUILD"
          xcrun stapler validate "$extract/$APP_NAME.app"
          spctl --assess --type exec --verbose=4 "$extract/$APP_NAME.app"
          cp "$RUNNER_TEMP/app-notarization.json" "$dist/$APP_NAME-$VERSION-app-notarization.json"
          cp "$RUNNER_TEMP/app-notarization-log.json" "$dist/$APP_NAME-$VERSION-app-notarization-log.json"
          cp "$RUNNER_TEMP/dmg-notarization.json" "$dist/$APP_NAME-$VERSION-dmg-notarization.json"
          cp "$RUNNER_TEMP/dmg-notarization-log.json" "$dist/$APP_NAME-$VERSION-dmg-notarization-log.json"
          ./scripts/generate-sbom.sh \
            --app "$APP_PATH" \
            --version "$VERSION" \
            --build "$BUILD" \
            --commit "$GITHUB_SHA" \
            --output "$dist/$APP_NAME-$VERSION.spdx.json"
          (
            cd "$dist"
            shasum -a 256 ./*.dmg ./*.zip ./*.json > "$APP_NAME-$VERSION.sha256"
          )
          echo "dist=$dist" >> "$GITHUB_OUTPUT"

      - name: Attest release provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            ${{ steps.package.outputs.dist }}/*.dmg
            ${{ steps.package.outputs.dist }}/*.zip
            ${{ steps.package.outputs.dist }}/*.json
            ${{ steps.package.outputs.dist }}/*.sha256

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          DIST: ${{ steps.package.outputs.dist }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$GITHUB_SHA" == "$(git rev-parse origin/main)" ]] || { echo "::error::main advanced during release verification."; exit 1; }
          remote_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')"
          [[ "$remote_tag" == "$ORIGINAL_TAG_OBJECT" ]] || { echo "::error::Release tag object changed during the workflow."; exit 1; }
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$remote_tag" --jq '.verification.verified')" == "true" ]] || { echo "::error::Release tag signature is no longer verified."; exit 1; }
          tagged_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$remote_tag" --jq '.object.sha')"
          [[ "$tagged_commit" == "$GITHUB_SHA" ]] || { echo "::error::Release tag moved during the workflow."; exit 1; }
          gh release create "$GITHUB_REF_NAME" "$DIST"/* \
            --verify-tag \
            --title "$APP_NAME $VERSION" \
            --draft \
            --prerelease \
            --generate-notes

      - name: Remove signing material
        if: always()
        run: |
          rm -f "${PROFILE_PATH_NEW:-}" "${PROFILE_PATH_OLD:-}"
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
