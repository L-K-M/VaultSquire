name: Documentation issue
description: Report an inconsistency, ambiguity, stale source, or missing decision.
title: "[Docs]: "
labels: [documentation]
body:
  - type: dropdown
    id: document
    attributes:
      label: Controlling area
      options:
        - PLAN.md
        - SECURITY_AND_TESTING.md
        - ARCHITECTURE.md
        - Vaultwarden implementation research
        - Proton CLI research
        - Keyguard source-isolation governance
        - Repository governance
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Cite exact sections and explain the conflict or ambiguity.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Prefer public documentation or immutable source revisions. Do not paste private implementation or real vault data.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed resolution
      description: State which document should control and what remains deferred.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This report contains no secrets, real vault data, raw CLI output, logs, databases, or prohibited source material.
          required: true
